name: Release

# Runs only when you publish a release on GitHub. Nothing is released automatically.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build -p teardrop --release
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $ver = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/droppy.exe dist/droppy.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer/teardrop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist/droppy.exe, README.md, LICENSE -DestinationPath "dist/droppy-$tag-portable.zip" -Force
          Copy-Item dist/droppy.exe "dist/droppy-$tag.exe"
          Get-FileHash "dist/droppy-setup-$ver.exe", "dist/droppy-$tag.exe", "dist/droppy-$tag-portable.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $ver = $tag.TrimStart('v')
          gh release upload $tag "dist/droppy-setup-$ver.exe" "dist/droppy-$tag.exe" "dist/droppy-$tag-portable.zip" dist/SHA256SUMS.txt --clobber
