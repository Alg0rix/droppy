name: CI

# Runs only when something that can change the build changes. Docs, the README,
# screenshots and brand assets don't start it (the Docs workflow covers those).
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "installer/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "installer/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format (rustfmt)
        run: cargo fmt --all -- --check
      # All lints gate: the codebase is kept warning-free.
      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build -p teardrop --release
      - name: Installer builds (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0" installer/teardrop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist/droppy-setup-0.0.0.exe | Select-Object Name, Length
      - name: Selftest (renders every state headless)
        run: ./target/release/droppy.exe --selftest dist/selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-screenshots
          path: dist/selftest
          if-no-files-found: ignore

  # teardrop-core is pure logic; keeping it clean on Linux catches
  # Windows-only leakage and runs its tests without a GPU.
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint (clippy)
        run: cargo clippy -p teardrop-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p teardrop-core

  # Flag known-vulnerable dependency versions.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
