name: CI

# Runs only when something that can change the build changes. Docs, the README,
# screenshots and brand assets don't start it (the Docs workflow covers those).
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "installer/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "installer/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Targeted lint: only the lint groups that point at real bugs fail the
      # build (correctness and suspicious). Style lints are reported, not gated.
      - name: Lint (clippy, bug classes)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build -p teardrop --release
      - name: Installer builds (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0" installer/teardrop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist/droppy-setup-0.0.0.exe | Select-Object Name, Length
      - name: Selftest (renders every state headless)
        run: ./target/release/droppy.exe --selftest dist/selftest
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-screenshots
          path: dist/selftest
          if-no-files-found: ignore
