[workspace]
resolver = "2"
members = ["crates/teardrop-core", "crates/teardrop"]
default-members = ["crates/teardrop-core", "crates/teardrop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Teardrop"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
