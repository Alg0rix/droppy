[workspace]
resolver = "2"
members = ["crates/teardrop-core", "crates/teardrop"]
default-members = ["crates/teardrop-core", "crates/teardrop"]

[workspace.package]
version = "0.4.8"
edition = "2021"
authors = ["Teardrop"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }

# Small binary: optimise for size, link-time optimise, abort on panic (the unwind
# tables alone are ~300 KB). Untrusted input paths are fuzz-tested not to panic.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
