<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Droppy — true island feel</title>
<style>
  :root {
    --bg: #0b0c11;
    --blob: #0e0f14;
    --text: #f3f4f8;
    --text2: #a9adbd;
    --text3: #666b7c;
    --music: #34d17b;
    --focus: #f5a03d;
    --spring: cubic-bezier(.32,1.4,.38,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
  body { background: radial-gradient(900px 500px at 50% 0%, #1c2032, var(--bg)); min-height: 100vh; color: var(--text); display: flex; flex-direction: column; align-items: center; }
  .tray { position: fixed; top: 0; left: 0; right: 0; height: 30px; background: #00000030; border-bottom: 1px solid #ffffff10; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text3); letter-spacing: .08em; }
  .hint { color: var(--text3); font-size: 12.5px; margin: 24px 0 8px; text-align: center; line-height: 1.7; }
  .hint b { color: var(--text2); }
  .hint kbd { background: #ffffff10; border-radius: 5px; padding: 1px 7px; font-family: inherit; }

  /* hover lift on the blob + buttons */
  .blob { transition: width .5s var(--spring), height .5s var(--spring), border-radius .5s var(--spring), box-shadow .3s, translate .3s var(--spring); }
  .blob:hover { box-shadow: 0 26px 70px #000000dd, inset 0 1px 0 #ffffff14; translate: 0 -2px; }
  .blob.s0 { cursor: pointer; }
  .f1 .acts button, .f2 .btns button, .f2 .bot .util span, .mctl span { transition: background .15s, color .15s, transform .15s var(--spring); }
  .f1 .acts button:hover, .f2 .btns .g:hover { background: #ffffff22; transform: scale(1.08); }
  .f2 .btns .main:hover, .f1 .acts .go:hover { filter: brightness(1.12); transform: scale(1.04); }
  .f2 .bot .util span:hover { color: var(--text); transform: scale(1.15); }
  .mctl span:hover { color: var(--text); transform: scale(1.15); }
  .f2 .side .eyeschip:hover { background: #ffffff16; }

  /* ============ the blob ============ */
  .blob {
    margin-top: 60px;
    background: #0d0e13;
    border: 1px solid #ffffff10;
    box-shadow: 0 20px 60px #000000cc, inset 0 1px 0 #ffffff0d;
    overflow: hidden;
    position: relative;
    transition: width .5s var(--spring), height .5s var(--spring), border-radius .5s var(--spring);
    cursor: default;
  }
  /* stage 0: collapsed pill */
  .blob.s0 { width: 176px; height: 42px; border-radius: 21px; }
  /* stage 1: quick glance — wide pill */
  .blob.s1 { width: 430px; height: 74px; border-radius: 37px; }
  /* stage 2: full activity — tall blob, still a pill not a card.
     Width/height come from the page (inline style): the island sizes
     itself to the activity, like the real Dynamic Island. */
  .blob.s2 { border-radius: 40px; }

  .face { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .4s var(--spring); transform: scale(.94); }
  .s0 .f0, .s1 .f1, .s2 .f2 { opacity: 1; pointer-events: auto; transform: none; }
  .s1 .f1 { transition-delay: .12s; }
  .s2 .f2 { transition-delay: .12s; }

  .ring { width: 17px; height: 17px; border-radius: 50%; background: conic-gradient(var(--focus) 0 24%, #ffffff16 24% 100%); display: grid; place-items: center; flex: none; }
  .ring i { width: 11px; height: 11px; border-radius: 50%; background: var(--blob); }
  .eyes { display: flex; gap: 5px; flex: none; }
  .eye { width: 14px; height: 16px; border-radius: 7px; background: #fff; position: relative; }
  .eye::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #191b24; left: 4px; top: 7px; }
  .mmss { margin-left: auto; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* f1 — quick glance: spread the same info wide + transport */
  .f1 { gap: 14px; padding: 0 20px; }
  .f1 .big { width: 30px; height: 30px; }
  .f1 .big i { width: 21px; height: 21px; }
  .f1 .sess { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .f1 .sess .t { font-size: 15px; font-weight: 600; }
  .f1 .sess .s { font-size: 11px; color: var(--text3); }
  .f1 .bigmm { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .f1 .acts { display: flex; gap: 8px; flex: none; }
  .f1 .acts button { border: none; background: #ffffff12; color: var(--text); width: 34px; height: 34px; border-radius: 50%; font-size: 13px; cursor: pointer; }
  .f1 .acts .go { background: var(--focus); color: #20130a; font-weight: 700; }

  /* f2 — full focus activity, inline in the blob */
  .f2 { flex-direction: column; align-items: stretch; padding: 18px 22px 16px; }
  .f2 .top { display: flex; align-items: center; gap: 10px; font-size: 10.5px; letter-spacing: .16em; color: var(--text3); font-weight: 700; }
  .f2 .top .live { width: 7px; height: 7px; border-radius: 50%; background: var(--focus); animation: pl 1.6s infinite; }
  @keyframes pl { 50% { opacity: .3; } }
  .f2 .top .up { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .f2 .mid { display: flex; align-items: center; gap: 20px; margin-top: 14px; flex: 1; }
  .fRing { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(var(--focus) 0 24%, #ffffff12 24% 100%); display: grid; place-items: center; flex: none; }
  .fRing i { width: 92px; height: 92px; border-radius: 50%; background: var(--blob); display: flex; flex-direction: column; align-items: center; justify-content: center; font-style: normal; }
  .fRing .t { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fRing .p { font-size: 9px; letter-spacing: .15em; color: var(--focus); font-weight: 700; }
  .f2 .side { flex: 1; min-width: 0; }
  .f2 .side .sess { font-size: 15px; font-weight: 600; }
  .f2 .side .done { font-size: 11.5px; color: var(--text3); margin-top: 3px; }
  .f2 .side .eyeschip { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; background: #ffffff0d; border-radius: 999px; padding: 5px 11px; font-size: 11.5px; color: var(--text2); }
  .f2 .side .eyeschip b { color: var(--text); }
  .f2 .btns { display: flex; gap: 10px; margin-top: 8px; }
  .f2 .btns .main { flex: 1; height: 38px; border-radius: 19px; border: none; background: var(--focus); color: #20130a; font-weight: 700; font-size: 13px; cursor: pointer; }
  .f2 .btns .g { width: 38px; height: 38px; border-radius: 50%; border: none; background: #ffffff12; color: var(--text); cursor: pointer; }
  .f2 .bot { display: flex; align-items: center; margin-top: 12px; font-size: 11px; color: var(--text3); }
  .f2 .bot .nav { margin-left: auto; display: flex; gap: 5px; }
  .f2 .bot .nav i { width: 6px; height: 6px; border-radius: 3px; background: #ffffff22; }
  .f2 .bot .nav i.on { width: 16px; background: var(--focus); }
  .f2 .bot .util { margin-left: 10px; display: flex; gap: 2px; }
  .f2 .bot .util span { color: var(--text3); font-size: 13px; padding: 3px 6px; cursor: pointer; }

  /* music variant of s2, toggled below */
  .mrow { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .mart { width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(140deg, #37e58c, #0e7c45); display: grid; place-items: center; font-size: 24px; flex: none; }
  .mi { flex: 1; min-width: 0; }
  .mi .tt { font-size: 15px; font-weight: 600; }
  .mi .ar { font-size: 11.5px; color: var(--text3); margin-top: 3px; }
  .viz { display: flex; gap: 3px; align-items: flex-end; height: 16px; flex: none; }
  .viz i { width: 3px; border-radius: 2px; background: var(--music); animation: vb 1s ease-in-out infinite; }
  .viz i:nth-child(1) { height: 8px; } .viz i:nth-child(2) { height: 14px; animation-delay: .15s; }
  .viz i:nth-child(3) { height: 6px; animation-delay: .3s; } .viz i:nth-child(4) { height: 12px; animation-delay: .45s; } .viz i:nth-child(5) { height: 9px; animation-delay: .6s; }
  @keyframes vb { 50% { transform: scaleY(.4); } }
  .mbar { height: 4px; border-radius: 2px; background: #ffffff16; margin-top: 14px; position: relative; }
  .mbar i { position: absolute; inset: 0 62% 0 0; background: var(--music); border-radius: 2px; }
  .mlyr { margin-top: 10px; font-size: 12.5px; color: var(--text3); line-height: 1.75; }
  .mlyr .now { color: var(--text); font-weight: 600; }
  .mctl { display: flex; justify-content: center; gap: 22px; margin-top: 6px; font-size: 15px; color: var(--text2); }
  .mctl .pl { color: var(--text); font-size: 17px; }

  /* shared widgets for the other pages */
  .lrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 12.5px; color: var(--text2); }
  .lrow .ic { width: 26px; height: 26px; border-radius: 9px; background: #ffffff0d; display: grid; place-items: center; font-size: 12px; flex: none; }
  .lrow .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .tx b { color: var(--text); font-weight: 600; }
  .lrow .meta { font-size: 10.5px; color: var(--text3); flex: none; }
  .tbtn { border: none; border-radius: 999px; padding: 7px 14px; font-size: 11.5px; font-weight: 600; background: #ffffff12; color: var(--text); cursor: pointer; }
  .tbtn:hover { background: #ffffff22; }
  .tbtn.acc { background: var(--acc, var(--focus)); color: #1d1206; }
  .tbtn.acc:hover { filter: brightness(1.1); }
  .btnrow { display: flex; gap: 8px; margin-top: 10px; }
  .big2 { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .big2 small { font-size: 13px; font-weight: 600; color: var(--text3); }
  .ubar { height: 5px; border-radius: 3px; background: #ffffff14; overflow: hidden; margin-top: 6px; }
  .ubar i { display: block; height: 100%; border-radius: 3px; }
  .inp { flex: 1; height: 30px; border-radius: 15px; border: 1px solid #ffffff14; background: #ffffff08; color: var(--text3); font-size: 12px; display: flex; align-items: center; padding: 0 12px; }
  .chk { width: 15px; height: 15px; border-radius: 5px; border: 1.5px solid #ffffff33; flex: none; }
  .chk.on { background: var(--acc, var(--focus)); border-color: transparent; display: grid; place-items: center; font-size: 10px; color: #1d1206; }
  .chk.on::after { content: "✓"; }
  .chat { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
  .bub { max-width: 82%; border-radius: 15px; padding: 7px 11px; font-size: 12px; line-height: 1.45; }
  .bub.me { align-self: flex-end; background: #ffffff14; color: var(--text); border-bottom-right-radius: 5px; }
  .bub.ai { align-self: flex-start; background: color-mix(in srgb, var(--acc, var(--focus)) 16%, transparent); color: var(--text); border-bottom-left-radius: 5px; }
  .mid { display: flex; align-items: center; gap: 20px; margin-top: 14px; flex: 1; }
  .col1 { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }

  /* nav styles: dock icons + peek labels */
  .nDock { display: flex; gap: 2px; margin: 0 auto; }
  .nDock button { width: 26px; height: 24px; border: none; border-radius: 8px; background: transparent; color: var(--text3); font-size: 12.5px; cursor: pointer; transition: all .15s; }
  .nDock button:hover { color: var(--text); background: #ffffff10; }
  .nDock button.on { background: var(--acc); color: #1d1206; }
  .nPeek { flex: 1; display: flex; align-items: center; justify-content: space-between; min-width: 0; }
  .nPeek .edge { font-size: 11px; color: var(--text3); cursor: pointer; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
  .nPeek .edge:hover { color: var(--text); background: #ffffff10; }
  .nPeek .cur { font-size: 11.5px; font-weight: 700; color: var(--acc); letter-spacing: .1em; text-transform: uppercase; }
  .nWheel { flex: 1; text-align: center; font-size: 10.5px; color: var(--text3); }
  .nWheel b { color: var(--acc); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="tray">T E A R D R O P · island feel</div>

<div class="blob s0" id="blob">
  <!-- stage 0: the collapsed pill -->
  <div class="face f0">
    <span class="ring"><i></i></span>
    <span class="eyes"><span class="eye"></span><span class="eye"></span></span>
    <span class="mmss">19:00</span>
  </div>
  <!-- stage 1: quick glance -->
  <div class="face f1">
    <span class="ring big"><i></i></span>
    <div class="sess"><div class="t">Focus</div><div class="s">Session 3 of 4 · break after</div></div>
    <div class="bigmm">19:00</div>
    <div class="acts"><button title="reset">↺</button><button class="go" title="pause">⏸</button></div>
  </div>
  <!-- stage 2: full activity -->
  <div class="face f2" id="f2"></div>
</div>

<div class="hint"><b>Hover</b>: glance. <b>Dwell ~1s</b>: opens full. <b>Click</b>: pin/unpin. <b>Leave</b>: collapse.<br>
<b>← → / wheel</b> or nav switches all 12 pages · <b>1</b> dots · <b>2</b> icon dock · <b>3</b> edge-peek · <b>4</b> wheel-title<br>
<b>Same blob, three sizes. No cards inside.</b></div>

const f2 = document.getElementById("f2");
const f1 = document.querySelector(".f1");
let stage = 0, pi = 0, pinned = false, dwell = 0;
const ACC = { music: "var(--music)", focus: "var(--focus)", water: "#4ea8f5", today: "#f5785c", voice: "#ef4444", ai: "#a78bfa", speed: "#38bdf8" };

    html: `

  { id: "speed", size: [320, 230], ic: "◠", label: "SPEEDTEST", up: "last run 2h ago", glance: ["Network", "86 ↓ 41 ↑ Mbps", "◠"],

  { id: "voice", size: [320, 240], ic: "🎙", label: "VOICE RECORDER", up: "idle", glance: ["Voice", "tap to record", "🎙"],

      <div class="mid"><div class="col1" style="align-items:center;text-align:center">
        <button class="fRing" style="border:none;cursor:pointer;background:conic-gradient(#ef4444 0 100%, #ffffff12 0)"><i><span class="t" style="font-size:22px">REC</span></i></button>
        <div class="done" style="font-size:11.5px;color:var(--text3);margin-top:12px">saves to Music\\Droppy Recordings · max 2h</div>
      </div></div>` },
  { id: "ai", size: [430, 270], ic: "✦", label: "AI CHAT", up: "gpt-6-luna", glance: ["Ask anything", "gpt-6-luna", "✦"],
    html: `
      <div class="col1" style="margin-top:12px">
        <div class="chat">
          <div class="bub me">summarize today's meetings</div>
          <div class="bub ai">You have 2: Standup at 09:00 (in 12m) and Design review at 14:00. Want me to draft the agenda?</div>
        </div>
        <div class="btnrow" style="margin-top:12px"><div class="inp">Ask anything…</div><button class="tbtn acc">➤</button></div>
      </div>` },
];

let navMode = 1; // 1 dots · 2 icon dock · 3 edge-peek · 4 wheel title
function botRow() {
  const p = PAGES[pi];
  const prev = PAGES[(pi + PAGES.length - 1) % PAGES.length], next = PAGES[(pi + 1) % PAGES.length];
  let nav;
  if (navMode === 2) {
    nav = `<div class="nav nDock">${PAGES.map((q, i) => `<button class="${i === pi ? "on" : ""}" title="${q.glance[0]}" onclick="go(${i});event.stopPropagation()">${q.ic}</button>`).join("")}</div>`;
  } else if (navMode === 3) {
    nav = `<div class="nav nPeek"><span class="edge" onclick="go(${pi - 1});event.stopPropagation()">‹ ${prev.glance[0]}</span><span class="cur">${p.glance[0]}</span><span class="edge" onclick="go(${pi + 1});event.stopPropagation()">${next.glance[0]} ›</span></div>`;
  } else if (navMode === 4) {
    nav = `<div class="nav nWheel"><b>${p.glance[0]}</b> · scroll to switch</div>`;
  } else {
    nav = `<div class="nav">${PAGES.map((q, i) => `<i class="${i === pi ? "on" : ""}" style="${i === pi ? "background:var(--acc)" : ""}" onclick="go(${i});event.stopPropagation()"></i>`).join("")}</div>`;
  }
  return `<div class="bot">Sun 25 · 08:21${nav}<div class="util"><span>📌</span><span>⚙</span></div></div>`;
}
function render() {
  const p = PAGES[pi];
  blob.className = "blob s" + stage;
  blob.style.width = stage === 2 ? p.size[0] + "px" : "";
  blob.style.height = stage === 2 ? p.size[1] + "px" : "";
  blob.style.setProperty("--acc", ACC[p.id] || "#8f95a8");
  const live = `<span class="live" style="background:var(--acc)"></span>`;
  f2.innerHTML = `<div class="top">${live}${p.label}<span class="up">${p.up}</span></div>` + p.html + botRow();
  f1.querySelector(".sess").innerHTML = `<div class="t">${p.glance[0]}</div><div class="s">${p.glance[1]}</div>`;
  f1.querySelector(".bigmm").textContent = p.glance[2];
  f1.querySelector(".acts").style.display = p.id === "focus" ? "" : "none";
}
function go(i) { pi = (i + PAGES.length) % PAGES.length; render(); }

blob.addEventListener("mouseenter", () => {
  if (pinned) return;
  stage = Math.max(stage, 1);
  render();
  clearTimeout(dwell);
  dwell = setTimeout(() => { stage = 2; render(); }, 900);
});
blob.addEventListener("mouseleave", () => {
  clearTimeout(dwell);
  if (!pinned) { stage = 0; render(); }
});
blob.addEventListener("click", e => {
  if (e.target.closest("button, .mctl span, .util span, .nav i, .inp")) return;
  clearTimeout(dwell);
  pinned = !pinned;
  stage = pinned ? 2 : 0;
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(pi + 1);
  if (e.key === "ArrowLeft") go(pi - 1);
  if (e.key >= "1" && e.key <= "4") { navMode = +e.key; render(); }
  const d = PAGES.findIndex(p => p.id[0] === e.key.toLowerCase());
  if (d >= 0) go(d);
});
blob.addEventListener("wheel", e => { e.preventDefault(); go(pi + (e.deltaY > 0 ? 1 : -1)); }, { passive: false });
render();
</script>
</body>
</html>
